      x-no-sdk: true
      tags:
        - dji-pilot-2-api
      summary: delete map elements from a dji pilot 2 remote controller
      parameters:
        - name: workspace_uuid
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/uuid"
        - name: element_uuid
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/uuid"
      responses:
        "200":
          description: Returns
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/dji_pilot_2_api_map_elements_delete_response"

        "400":
          $ref: "#/components/responses/400"
        "401":
          $ref: "#/components/responses/401"
        "403":
          $ref: "#/components/responses/403"
        "410":
          $ref: "#/components/responses/410"
      security:
        - dji_pilot_2_api: []

  /connection-link/dji-pilot-2/api/manage/api/v1/workspaces/{workspace_uuid}/devices/topology:
    get:
      x-no-sdk: true
      tags:
        - dji-pilot-2-api
      summary: get devices from workspace
      parameters:
        - name: workspace_uuid
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/uuid"
      responses:
        "200":
          description: Returns
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/dji_pilot_2_api_manage_devices_topology_response"

        "400":
          $ref: "#/components/responses/400"
        "401":
          $ref: "#/components/responses/401"
        "403":
          $ref: "#/components/responses/403"
        "410":
          $ref: "#/components/responses/410"
      security:
        - dji_pilot_2_api: []



  /info/collision-objects:
    get:
      tags:
        - info
      summary: Get collision objects in an area
      parameters:
        - name: longitude
          in: query
          required: true
          schema:
            type: number
        - name: latitude
          in: query
          required: true
          schema:
            type: number
        - name: radius
          in: query
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Returns the collision objects
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/info_collision_objects"

        "204":
          description: No Content (api is fetching the data from 3rd party service, call this endpoint again later to receive the result)

        "400":
          $ref: "#/components/responses/400"
        "401":
          $ref: "#/components/responses/401"
        "403":
          $ref: "#/components/responses/403"
      security:
        - user_auth: []

components:
  schemas:
    # data type

    id:
      type: number
      example: 42

    id_nullable:
      type: number
      nullable: true
      example: 42

    uuid:
      type: string
      example: "87ffce7c-da28-49cf-9134-8db9fd87ccd1"

    unixms:
      type: number
      example: "1239213862"
      description: Time in milliseconds since Unix Epoch time (January 1st, 1970 )

    timestamptz:
      type: string
      format: timestamptz
      description: ISO 8601 format with a timezone
      example: "2023-12-11 23:06:52.7879+00"

    timestamp:
      type: string
      format: timestamptz
      description: ISO 8601 format without a timezone
      example: "2023-12-11 23:06:52.7879"

    email:
      type: string
      example: "john.doe@example.com"

    password:
      type: string
      description: Maximum length is 72 Bytes (utf-8).
      example: "j9876sa1kjhqsa6dtasd12="

    size_in_bytes:
      type: integer
      description: in bytes

    # general

    reference:
      type: object
      required:
        - id
      properties:
        id:
          $ref: "#/components/schemas/id"

    #routes

    # auth

    auth_login_post:
      type: object
      required:
        - username
        - password
      properties:
        username:
          $ref: "#/components/schemas/email"
        password:
          type: string

    auth_login_with_token_post:
      type: object
      required:
        - token
      properties:
        token:
          type: string

    auth_register_post:
      deprecated: true
      type: object
      required:
        - name
        - email
      properties:
        email:
          $ref: "#/components/schemas/email"
        password:
          $ref: "#/components/schemas/password"

    auth_password_change_post:
      type: object
      required:
        - current_password
        - new_password
      properties:
        current_password:
          $ref: "#/components/schemas/password"
        new_password:
          $ref: "#/components/schemas/password"

    auth_password_reset_post:
      type: object
      required:
        - username
      properties:
        username:
          $ref: "#/components/schemas/email"

    auth_password_set_initial_post:
      type: object
      required:
        - new_password
      properties:
        new_password:
          $ref: "#/components/schemas/password"

    auth_password_set_new_post:
      type: object
      required:
        - new_password
        - code
      properties:
        new_password:
          $ref: "#/components/schemas/password"
        code:
          type: string

    auth_stream_token:
      type: object
      required:
        - token
      properties:
        token:
          type: string

    # user

    user:
      type: object
      required:
        - id
        - name
      properties:
        id:
          $ref: "#/components/schemas/id"
        name:
          type: string
          example: Harry Potter
        team_id:
          $ref: "#/components/schemas/id"

    user_self:
      type: object
      required:
        - id
        - name
        - email
        - created_at
        - locale
        - registration_incomplete
      properties:
        id:
          $ref: "#/components/schemas/id"
        name:
          type: string
          example: Harry Potter
        email:
          $ref: "#/components/schemas/email"
        created_at:
          $ref: "#/components/schemas/timestamptz"
        locale:
          type: string
          example: en-US
        registration_incomplete:
          type: boolean
        team_id:
          $ref: "#/components/schemas/id"

    user_patch:
      type: object
      properties:
        name:
          type: string
          example: Harry Potter
        email:
          $ref: "#/components/schemas/email"
        locale:
          type: string
          example: en-US


    user_my_organisations:
      type: array
      items:
        type: object
        required:
          - id
          - access_type
        properties:
          id:
            $ref: "#/components/schemas/id"
          access_type:
            type: integer
            description: 0 = owner, 1 = member


    user_my_teams:
      type: array
      items:
        type: object
        required:
          - id
          - access_type
        properties:
          id:
            $ref: "#/components/schemas/id"
          access_type:
            type: integer
            description: 0 = owner, 1 = member

    # team

    team:
      type: object
      required:
        - id
        - name
        - owner_user_id
        - created_at
        - state
      properties:
        id:
          $ref: "#/components/schemas/id"
        name:
          type: string
          example: Harry Potter
        owner_user_id:
          $ref: "#/components/schemas/id"
        created_at:
          $ref: "#/components/schemas/timestamptz"
        state:
          type: integer
          description: 0 = invited, 1 = live, 2 = locked, 3 = deleted
        organisation_id:
          $ref: "#/components/schemas/id"
        logo_file_id:
          $ref: "#/components/schemas/id"

    team_all_teams:
      type: array
      items:
        type: object
        required:
          - id
          - name
        properties:
          id:
            $ref: "#/components/schemas/id"
          name:
            type: string
          organisation_id:
            $ref: "#/components/schemas/id"
          logo_file_id:
            $ref: "#/components/schemas/id"

    team_post:
      type: object
      required:
        - name
        - organisation_id
        - owner_user_id
      properties:
        name:
          type: string
          example: Harry Potter
        organisation_id:
          $ref: "#/components/schemas/id"
        owner_user_id:
          $ref: "#/components/schemas/id"
        logo_file_id:
          $ref: "#/components/schemas/id"

    team_patch:
      type: object
      properties:
        name:
          type: string
          example: Harry Potter
        logo_file_id:
          $ref: "#/components/schemas/id_nullable"

    team_invite_member:
      type: object
      required:
        - email
      properties:
        email:
          $ref: "#/components/schemas/email"

    team_invite_member_post_response:
      $ref: "#/components/schemas/reference"

    team_members:
      type: array
      items:
        type: object
        required:
          - id
          - name
        properties:
          id:
            $ref: "#/components/schemas/id"
          name:
            type: string
            example: Harry Potter


    team_workspaces:
      type: array
      items:
        $ref: "#/components/schemas/workspace"

    # organisation

    organisation:
      type: object
      required:
        - id
        - name
        - owner_user_id
        - created_at
        - state
      properties:
        id:
          $ref: "#/components/schemas/id"
        name:
          type: string
          example: Harry Potter
        owner_user_id:
          $ref: "#/components/schemas/id"
        created_at:
          $ref: "#/components/schemas/timestamptz"
        state:
          type: integer
          description: 0 = invited, 1 = live, 2 = locked, 3 = deleted
        logo_file_id:
          $ref: "#/components/schemas/id"

    organisation_patch:
      type: object
      properties:
        name:
          type: string
          example: Harry Potter
        logo_file_id:
          $ref: "#/components/schemas/id_nullable"

    organisation_users:
      type: array
      items:
        $ref: "#/components/schemas/user"

    organisation_teams:
      type: array
      items:
        type: object
        required:
          - id
          - name
        properties:
          id:
            $ref: "#/components/schemas/id"
          name:
            type: string
            example: Harry Potter

    # admin

    admin_users:
      type: array
      items:
        $ref: "#/components/schemas/user_self"

    admin_users_post:
      type: object
      required:
        - email
      properties:
        name:
          type: string
          example: Harry Potter
        email:
          $ref: "#/components/schemas/email"

    admin_organisations:
      type: array
      items:
        $ref: "#/components/schemas/organisation"

    admin_organisation_post:
      type: object
      required:
        - name
        - owner_user_id
      properties:
        name:
          type: string
          example: Harry Potter
        owner_user_id:
          $ref: "#/components/schemas/id"
        logo_file_id:
          $ref: "#/components/schemas/id"


    admin_system_performance_os:
      type: object
      required:
        - os
        - cpu
        - uptime
        - ram_total
        - ram_free
        - load_avg
      properties:
        os:
          type: string
        cpu:
          type: string
        uptime:
          type: number
          description: in milliseconds
        ram_total:
          type: number
          description: in bytes
        ram_free:
          type: number
          description: in bytes
        load_avg:
          type: object
          required:
            - avg_1
            - avg_5
            - avg_15
          properties:
            avg_1:
              type: number
              description: last 1 minute (0-1)
            avg_5:
              type: number
              description: last 5 minutes (0-1)
            avg_15:
              type: number
              description: last 15 minutes (0-1)

    admin_system_performance_api_endpoints:
      type: array
      items:
        type: object
        required:
          - endpoint
          - http_method
          - total_calls
          - max_run_time
          - max_work_time
          - avg_run_time
          - avg_work_time
          - pop_standard_dev_run_time
          - pop_standard_dev_work_time
          - pop_standard_dev_run_time_fractional
          - pop_standard_dev_work_time_fractional
        properties:
          endpoint:
            type: string
          http_method:
            type: string
          total_calls:
            type: number
          max_run_time:
            type: number
            description: time until the response for this request has been sent (milliseconds)
          max_work_time:
            type: number
            description: approximate time the cpu has worked on this (not accurate) (milliseconds)
          avg_run_time:
            type: number
            description: arithmetic mean (milliseconds)
          avg_work_time:
            type: number
            description: arithmetic mean (milliseconds)
          pop_standard_dev_run_time:
            type: number
            description: population standard deviation (milliseconds)
          pop_standard_dev_work_time:
            type: number
            description: population standard deviation (milliseconds)
          pop_standard_dev_run_time_fractional:
            type: number
            description: population standard deviation relative to arithmetic mean (pop standard deviation / arithmetic mean)
          pop_standard_dev_work_time_fractional:
            type: number
            description: population standard deviation relative to arithmetic mean (pop standard deviation / arithmetic mean)

    admin_system_performance_api_endpoint_detail:
      type: array
      items:
        type: object
        required:
          - url
          - http_method
          - total_calls
          - max_run_time
          - max_work_time
          - avg_run_time
          - avg_work_time
          - pop_standard_dev_run_time
          - pop_standard_dev_work_time
          - pop_standard_dev_run_time_fractional
          - pop_standard_dev_work_time_fractional
        properties:
          url:
            type: string
          http_method:
            type: string
          total_calls:
            type: number
          max_run_time:
            type: number
            description: time until the response for this request has been sent (milliseconds)
          max_work_time:
            type: number
            description: approximate time the cpu has worked on this (not accurate) (milliseconds)
          avg_run_time:
            type: number
            description: arithmetic mean (milliseconds)
          avg_work_time:
            type: number
            description: arithmetic mean (milliseconds)
          pop_standard_dev_run_time:
            type: number
            description: population standard deviation (milliseconds)
          pop_standard_dev_work_time:
            type: number
            description: population standard deviation (milliseconds)
          pop_standard_dev_run_time_fractional:
            type: number
            description: population standard deviation relative to arithmetic mean (pop standard deviation / arithmetic mean)
          pop_standard_dev_work_time_fractional:
            type: number
            description: population standard deviation relative to arithmetic mean (pop standard deviation / arithmetic mean)


    admin_system_database_info:
      type: object
      required:
        - tables
        - database
      properties:
        tables:
          type: array
          items:
            type: object
            required:
              - name
              - size
              - row_count
            properties:
              name:
                type: string
              size:
                $ref: "#/components/schemas/size_in_bytes"
              row_count:
                type: integer
                description: estimated
        database:
          type: object
          required:
            - size
            - version
          properties:
            size:
              $ref: "#/components/schemas/size_in_bytes"
            version:
              type: string


    # file

    file:
      type: object
      required:
        - id
        - name
        - created_at
      properties:
        id:
          $ref: "#/components/schemas/id"
        name:
          type: string
        created_at:
          $ref: "#/components/schemas/timestamptz"
        thumbnail_format:
          type: string
          description: e.g. jpg (not null if a thumbnail is available at /file/thumbnail/)

    file_get_multiple:
      type: array
      items:
        $ref: "#/components/schemas/file"

    file_get_multiple_post:
      type: object
      required:
        - ids
      properties:
        ids:
          type: array
          items:
            $ref: "#/components/schemas/id"

    # workspace


    workspace:
      oneOf:
        - $ref: "#/components/schemas/workspace_for_team"
        - $ref: "#/components/schemas/workspace_for_organisation"

    workspace_for_organisation:
      type: object
      required:
        - id
        - name
        - longitude
        - latitude
        - owner_organisation_id
      properties:
        id:
          $ref: "#/components/schemas/id"
        name:
          type: string
        longitude:
          type: number
        latitude:
          type: number
        owner_organisation_id:
          $ref: "#/components/schemas/id"

    workspace_for_team:
      type: object
      required:
        - id
        - name
        - longitude
        - latitude
        - owner_team_id
      properties:
        id:
          $ref: "#/components/schemas/id"
        name:
          type: string
        longitude:
          type: number
        latitude:
          type: number
        owner_team_id:
          $ref: "#/components/schemas/id"

    workspace_patch:
      type: object
      properties:
        name:
          type: string
        longitude:
          type: number
        latitude:
          type: number

    workspaces_post:
      oneOf:
        - $ref: "#/components/schemas/workspaces_post_for_team"
        - $ref: "#/components/schemas/workspaces_post_for_organisation"

    workspaces_post_for_team:
      type: object
      required:
        - name
        - longitude
        - latitude
        - team_id
      properties:
        name:
          type: string
        longitude:
          type: number
        latitude:
          type: number
        team_id:
          $ref: "#/components/schemas/id"

    workspaces_post_for_organisation:
      type: object
      required:
        - name
        - longitude
        - latitude
        - organisation_id
      properties:
        name:
          type: string
        longitude:
          type: number
        latitude:
          type: number
        organisation_id:
          $ref: "#/components/schemas/id"

    workspace_files:
      type: array
      items:
        $ref: "#/components/schemas/file"

    workspace_file_post:
      type: object
      required:
        - file
        - filename
      properties:
        file:
          type: string
          format: binary
        filename:
          type: string

    workspace_file_patch:
      type: object
      properties:
        filename:
          type: string

    workspace_invite_team_post:
      type: object
      required:
        - team_id
      properties:
        team_id:
          $ref: "#/components/schemas/id"

    workspace_kick_team_post:
      type: object
      required:
        - team_id
      properties:
        team_id:
          $ref: "#/components/schemas/id"

    workspace_permissions:
      type: array
      items:
        type: object
        required:
          - team_id
        properties:
          team_id:
            $ref: "#/components/schemas/id"


    workspace_missions:
      type: array
      items:
        $ref: "#/components/schemas/mission"

    workspace_connections:
      type: array
      items:
        $ref: "#/components/schemas/connection"

    connection_post:
      type: object
      required:
        - name
        - workspace_id
      properties:
        name:
          type: string
        workspace_id:
          $ref: "#/components/schemas/id"

    connection_post_response:
      type: object
      required:
        - connection_id
        - secret
      properties:
        connection_id:
          type: string
        secret:
          type: string

    connection:
      type: object
      description: "property `drone_id`: the currently connected drone (does not mean that the drone is currently online)"
      required:
        - id
        - name
        - workspace_id
        - stream_is_alive
      properties:
        id:
          $ref: "#/components/schemas/id"
        name:
          type: string
        remote_controller_id:
          $ref: "#/components/schemas/id"
        drone_id:
          $ref: "#/components/schemas/id"
        workspace_id:
          $ref: "#/components/schemas/id"
        stream_is_alive:
          type: boolean

    connection_live_share_keys_post:
      type: object
      properties:
        valid_until:
          $ref: "#/components/schemas/timestamptz"
        name:
          type: string

    connection_live_share_keys_post_response:
      $ref: "#/components/schemas/connection_live_share_key"

    connection_live_share_keys_get:
      type: array
      items:
        $ref: "#/components/schemas/connection_live_share_key"

    connection_live_share_key:
      type: object
      required:
        - id
        - key
        - connection_id
        - created_by
        - created_at
        - valid_until
      properties:
        id:
          $ref: "#/components/schemas/id"
        key:
          type: string
        name:
          type: string
        connection_id:
          $ref: "#/components/schemas/id"
        created_by:
          $ref: "#/components/schemas/id"
        created_at:
            $ref: "#/components/schemas/timestamptz"
        valid_until:
          $ref: "#/components/schemas/timestamptz"

    workspace_geo_objects_get:
      type: array
      items:
        $ref: "#/components/schemas/geo_object"

    workspace_geo_objects_post:
      $ref: "#/components/schemas/geo_object_create"

    workspace_geo_object_patch:
      $ref: "#/components/schemas/geo_object_patch"

    geo_object:
      anyOf:
        - $ref: "#/components/schemas/geo_object_type0"
        - $ref: "#/components/schemas/geo_object_type1"
        - $ref: "#/components/schemas/geo_object_type2"
        - $ref: "#/components/schemas/geo_object_type3"

    geo_object_base:
      type: object
      required:
        - id
        - uuid
        - name
        - created_at
        - updated_at
        - type
        - sub_type
        - tasks
      properties:
        id:
          $ref: "#/components/schemas/id"
        uuid:
          $ref: "#/components/schemas/uuid"
        workspace_id:
          $ref: "#/components/schemas/id"
        name:
          type: string
        created_at:
          $ref: "#/components/schemas/timestamptz"
        updated_at:
          $ref: "#/components/schemas/timestamptz"
        type:
          type: integer
        sub_type:
          type: integer
        tasks:
          type: array
          items:
            $ref: "#/components/schemas/reference"
      description: "if workspace_id is not present, it is a global geoobject"

    geo_object_type0:
      anyOf:
        - $ref: "#/components/schemas/geo_object_type0_subtype0"
        - $ref: "#/components/schemas/geo_object_type0_subtype1"
        - $ref: "#/components/schemas/geo_object_type0_subtype2"
        - $ref: "#/components/schemas/geo_object_type0_subtype3"

    geo_object_type0_subtype0:
      allOf:
        - $ref: "#/components/schemas/geo_object_base"
        - type: object
          required:
            - type
            - sub_type
            - config
          properties:
            type:
              type: integer
              x-const: 0
            sub_type:
              type: integer
              x-const: 0
            config:
              $ref: "#/components/schemas/geo_object_type0_subtype0_config"

    geo_object_type0_subtype0_config:
      type: object
      required:
        - point
        - color
      properties:
        point:
          type: array
          items:
            type: number
          minItems: 3
          maxItems: 3
          description: "[lng, lat, elevation]"

        color:
          type: string
          description: hex

    geo_object_type0_subtype1:
      allOf:
        - $ref: "#/components/schemas/geo_object_base"
        - type: object
          required:
            - type
            - sub_type
            - config
          properties:
            type:
              type: integer
              x-const: 0
            sub_type:
              type: integer
              x-const: 1
            config:
              $ref: "#/components/schemas/geo_object_type0_subtype1_config"

    geo_object_type0_subtype1_config:
      type: object
      required:
        - line
        - color
      properties:
        line:
          type: array
          items:
            type: array
            items:
              type: number
            minItems: 3
            maxItems: 3
          description: "[[lng, lat, elevation], [lng, lat, elevation]]"
        color:
          type: string
          description: hex

    geo_object_type0_subtype2:
      allOf:
        - $ref: "#/components/schemas/geo_object_base"
        - type: object
