        radius:
          type: number
        color:
          type: string
          description: hex

    geo_object_type1:
      allOf:
        - $ref: "#/components/schemas/geo_object_base"
        - type: object
          required:
            - type
            - sub_type
            - config
          properties:
            type:
              type: integer
              x-const: 1
            sub_type:
              type: integer
            config:
              $ref: "#/components/schemas/geo_object_type1_config"

    geo_object_type1_config:
      type: object
