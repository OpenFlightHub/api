            - type
            - sub_type
            - config
          properties:
            type:
              type: integer
              x-const: 0
            sub_type:
              type: integer
              x-const: 0
            config:
              $ref: "#/components/schemas/geo_object_type0_subtype0_config"

    geo_object_type0_subtype0_config:
      type: object
      required:
        - point
        - color
      properties:
        point:
          type: array
          items:
            type: number
          minItems: 3
          maxItems: 3
          description: "[lng, lat, elevation]"

        color:
          type: string
          description: hex

    geo_object_type0_subtype1:
