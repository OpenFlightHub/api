  /auth/login:
    post:
      tags:
        - authentication
      summary: login as a user (with credentials)
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/auth_login_post"
        required: true
      responses:
        "200":
          description: Logged in as user
          headers:
            Set-Cookie:
              $ref: "#/components/headers/user_auth"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/reference"
        "418":
          description: Invalid credentials

        "400":
          $ref: "#/components/responses/400"

  /auth/login-with-token:
    post:
