  responses:
    "400":
      description: Bad Request (Invalid input)
      content:
        text:
          schema:
            type: string
            example: ".x"
            description: the property `x` is invalid

    "401":
      description: Unauthorized (this endpoint requires authorization)
      content:
        text:
          schema:
            type: string

    "403":
      description: Forbidden (you do not have permission to do this)
      content:
        text:
          schema:
            type: string

    "410":
      description: Gone (we understood your request but whatever you where looking for does not exist)
      content:
        text:
          schema:
            type: string

  headers:
    user_auth:
      description: used for authentication of a user
      schema:
        type: string
        example: user-auth=abcde12345; Path=/; HttpOnly
    connection_link_auth:
      description: used for authentication of a connection link
      schema:
        type: string
        example: connect-auth=abcde12345; Path=/; HttpOnly

  securitySchemes:
    user_auth:
      type: apiKey
      in: cookie
      name: user-auth
    connection_link_auth:
      type: apiKey
      in: cookie
      name: connection-link-auth
    dji_pilot_2_api:
      type: apiKey
      in: header
      name: x-auth-token
