        data:
          type: object
          required:
            - id
          properties:
            id:
              $ref: "#/components/schemas/uuid"

    dji_pilot_2_api_map_element_groups_get_response:
      type: object
      required:
        - code
        - data
        - message
      properties:
        code:
          type: number
          example: 0
        message:
          type: string
          example: "success"
        data:
          type: array
          items:
            type: object
            required:
              - id
              - create_time
              - elements
              - is_lock
              - name
              - type
            properties:
              id:
                $ref: "#/components/schemas/uuid"
              name:
                type: string
              create_time:
                $ref: "#/components/schemas/unixms"
              is_lock:
                type: boolean
                description: if locked, elements of this group can not be deleted/modified
              type:
                type: number
                description: 0 = custom element group, 1 = default element group, 2 = app shared element group (the only visible group on dji pilot 2 app)
              elements:
                type: array
                items:
                  type: object
                  required:
                    - id
                    - name
                    - create_time
                    - update_time
                    - resource
                  properties:
                    id:
                      $ref: "#/components/schemas/uuid"
                    name:
                      type: string
                    create_time:
                      $ref: "#/components/schemas/unixms"
                    update_time:
                      $ref: "#/components/schemas/unixms"
                    resource:
                      type: object
                      required:
                        - type
                        - content
                      properties:
                        type:
                          type: number
                          description: 0 = point, 1 = line, 2 = polygon, 7 = circle
                        content:
                          type: object
                          required:
                            - type
                            - properties
                            - geometry
                          properties:
                            type:
                              type: string
                              description: geojson format
                            properties:
                              type: object
                              required:
                                - clampToGround
                                - color
                              properties:
                                clampToGround:
                                  type: boolean
                                is3d:
                                  type: boolean
                                color:
                                  type: string
                                  description: "only valid colors. BLUE: #2D8CF0, GREEN: #19BE6B, YELLOW: #FFBB00, RED: #E23C39, PURPLE: #B620E0"
                                  example: BLUE
                            geometry:
                              type: object
                              required:
                                - type
                                - coordinates
                              properties:
                                type:
                                  type: string
                                  description: geojson format
                                coordinates:
                                  type: array
                                  items:
                                    anyOf:
                                      - type: number
                                      - type: array
                                        items:
                                          type: number
                                  description: geojson format
                                radius:
                                  type: number

