        color:
          type: string
          description: hex

    geo_object_type0_subtype3:
      allOf:
        - $ref: "#/components/schemas/geo_object_base"
        - type: object
          required:
            - type
            - sub_type
            - config
          properties:
            type:
              type: integer
              x-const: 0
            sub_type:
              type: integer
              x-const: 3
