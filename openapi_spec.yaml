openapi: 3.0.3
info:
  x-logo:
    url: /api/logo.png

  title: OpenFlightHub - API
  description: |-
    # Welcome to the API!

    Check out our typescript client sdk [on github](https://github.com/)

    # Some important notes:
    - HTTP Response Code 410 (Gone) is used to indicate that you reached a valid API endpoint, but the item you where looking for does not exist in the database. 404 (Not found) indicates that the API endpoint does not exist, so probably your code is wrong!

    ## Path logic:

    For example a `tree` has a property `apples` which is an array of `apple`.

    These paths reflect some actions:
    | Path | Method | Description |
    | --- | --- | --- |
    | `/tree/{id}` | GET | returns the tree data and and array of apples, but only the id of each apple, not the apple data`{apples: [{ id: "1" }, { id: "2" }]}` |
    | `/apple/{id}` | GET | returns the apple data `{id: "1", weight: 0.2 }`|
    | `/apple/{id}` | PATCH | modify an apple. Each property is optional, only present properties will be updated in the database. Maybe some properties cannot be changed! |
    | `/apple/{id}` | DELETE | delete an apple |
    | `/apple` | POST | create a new apple |

    ## Request Bodies

    | Method | Request body |
    | --- | --- |
    | GET | No |
    | POST | No |
    | PATCH | No |
    | DELETE | No |

    ## Ordering of data
    Data is not guaruanteed to be ordered by id or creation date (unless endpoint specifically tells it does).

    ## General Status Codes

    These status codes can be returned by almost any path and are not specifically declared for each path!

    ### Methods: All

    * 400: you (the client) sent invalid data to the server
    * 401: you are not authorized (but this endpoint requires you to be)
    * 403: you do not have permission to do this
    * 410: we understood your request but whatever you where looking for does not exist

  version: 0.1.0
externalDocs:
  description: Learn more about Swagger Editor and OpenApi
  url: http://swagger.io
servers:
  - url: https://dev.openflighthub.org/api/
  - url: http://localhost/
tags:
  - name: authentication
    description: Everything about authentication

paths:

  # auth

  /auth/login:
    post:
      tags:
        - authentication
      summary: login as a user (with credentials)
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/auth_login_post'
        required: true
      responses:
          '200':
            description: Logged in as user
            headers:
              Set-Cookie:
                $ref: '#/components/headers/user_auth'
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/reference'
          '418':
            description: Invalid credentials

          '400':
              $ref: '#/components/responses/400'

  /auth/login-with-token:
    post:
      tags:
        - authentication
      summary: login as a user (with a token)
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/auth_login_with_token_post'
        required: true
      responses:
        '200':
          description: Logged in as user
          headers:
            Set-Cookie:
              $ref: '#/components/headers/user_auth'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/reference'
        '418':
          description: Invalid credentials

        '400':
            $ref: '#/components/responses/400'

  /auth/check:
    get:
      tags:
        - authentication
      summary: Check if i am still authenticated (via the cookie)
      responses:
        '200':
          description: You are authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/reference'

        '401':
          description: You are not authenticated


  /auth/password-change:
    post:
      tags:
        - authentication
      summary: change your password
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/auth_password_change_post'
        required: true
      responses:
        '200':
          description: password changed

        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
      security:
        - user_auth: []


  /auth/password-reset:
    post:
      tags:
        - authentication
      summary: request a password reset
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/auth_password_reset_post'
        required: true
      responses:
        '200':
          description: password reset process started

        '400':
          $ref: '#/components/responses/400'


  /auth/password-set-initial:
    post:
      tags:
        - authentication
      summary: set your password the first time
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/auth_password_set_initial_post'
        required: true
      responses:
        '200':
          description: new password set
        '418':
          description: Invalid code

        '400':
          $ref: '#/components/responses/400'
      security:
        - user_auth: []

  /auth/password-set-new:
    post:
      tags:
        - authentication
      summary: set your new password
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/auth_password_set_new_post'
        required: true
      responses:
        '200':
          description: new password set
        '418':
          description: Invalid code

        '400':
          $ref: '#/components/responses/400'

  /auth/register:
    post:
      deprecated: true
      tags:
        - authentication
      summary: Register as new user
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/auth_register_post'
        required: true
      responses:
        '200':
          description: User created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/reference'

        '400':
          $ref: '#/components/responses/400'

  /auth/logout:
    post:
      tags:
        - authentication
      summary: logout (delete auth cookie)
      responses:
          '200':
            description: Logged out
            headers:
              Set-Cookie:
                $ref: '#/components/headers/user_auth'
      security:
        - user_auth: []

  # user

  /user/{user_id}:
    get:
      tags:
        - user
      summary: Get a user
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/id'
      responses:
        '200':
          description: Returns a user definition
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/user'

        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '410':
          $ref: '#/components/responses/410'
      security:
        - user_auth: []

    patch:
      tags:
        - user
      summary: Modify an existing user. Each property is optional, only present properties will be updated in the database. Some properties cannot be changed!
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/id'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/user_patch'
        required: true
      responses:
        '200':
          description: User modified
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/user_self'

        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '410':
          $ref: '#/components/responses/410'
      security:
        - user_auth: []

  /user/self:
    get:
      tags:
        - user
      summary: Get your user information
      responses:
        '200':
          description: Returns your user definition
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/user_self'

        '401':
          $ref: '#/components/responses/401'
      security:
        - user_auth: []



  # workspace

  /workspace/my-workspaces:
    get:
      tags:
        - workspace
      summary: Get all your workspaces
      responses:
        '200':
          description: Returns your workspaces
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/workspace'

        '401':
          $ref: '#/components/responses/401'
      security:
        - user_auth: []

  /workspace:
    post:
      tags:
        - workspace
      summary: Create a workspace
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/workspaces_post'
        required: true
      responses:
        '200':
          description: Created workspace successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/reference'

        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
      security:
        - link_auth: []

  /workspace/{workspace_id}:
    get:
      tags:
        - workspace
      summary: Get a workspace
      parameters:
        - name: workspace_id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/id'
      responses:
        '200':
          description: Returns the workspace
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/workspace'

        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '410':
          $ref: '#/components/responses/410'
      security:
        - user_auth: []

    patch:
      tags:
        - workspace
      summary: Modify a workspace
      parameters:
        - name: workspace_id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/id'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/workspace_patch'
        required: true
      responses:
        '200':
          description: Modified workspace successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/workspace'

        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '410':
          $ref: '#/components/responses/410'
      security:
        - user_auth: []

    delete:
      tags:
        - workspace
      summary: Delete a workspace
      parameters:
        - name: workspace_id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/id'
      responses:
        '200':
          description: Deleted workspace successfully

        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '410':
          $ref: '#/components/responses/410'
      security:
        - user_auth: []

  /workspace/{workspace_id}/connections:
    get:
      tags:
        - workspace
      summary: Get all connections for this workspace
      parameters:
        - name: workspace_id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/id'
      responses:
        '200':
          description: Returns the connections
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/workspace_connections'

        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '410':
          $ref: '#/components/responses/410'
      security:
        - user_auth: []

    post:
      tags:
        - workspace
      summary: Create a new connection for a workspace
      parameters:
        - name: workspace_id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/id'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/workspace_connections_post'
      responses:
        '200':
          description: Returns the connection credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/workspace_connections_post_response'

        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '410':
          $ref: '#/components/responses/410'
      security:
        - user_auth: []

  /connection/{connection_id}:
    get:
      tags:
        - connection
      summary: Get a connection
      parameters:
        - name: connection_id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/id'
      responses:
        '200':
          description: Returns the connection
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connection'

        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '410':
          $ref: '#/components/responses/410'
      security:
        - user_auth: []

    delete:
      tags:
        - connection
      summary: Delete a connection
      parameters:
        - name: connection_id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/id'
      responses:
        '200':
          description: Deleted the connection successfully

        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '410':
          $ref: '#/components/responses/410'
      security:
        - user_auth: []


  /remote-controller/{remote_controller_id}:
    get:
      tags:
        - remote-controller
      summary: Get a remote controller
      parameters:
        - name: remote_controller_id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/id'
      responses:
        '200':
          description: Returns the remote controller
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/remote_controller'

        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '410':
          $ref: '#/components/responses/410'
      security:
        - user_auth: []


  /remote-controller/{remote_controller_id}/last-position:
    get:
      tags:
        - remote-controller
      summary: Get the last remote controller position
      parameters:
        - name: remote_controller_id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/id'
      responses:
        '200':
          description: Returns the remote controllers position
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/remote_controller_position'

        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '410':
          $ref: '#/components/responses/410'
      security:
        - user_auth: []


  /drone/{drone_id}:
    get:
      tags:
        - drone
      summary: Get a drone
      parameters:
        - name: drone_id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/id'
      responses:
        '200':
          description: Returns the drone
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/drone'

        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '410':
          $ref: '#/components/responses/410'
      security:
        - user_auth: []


  /drone/{drone_id}/last-position:
    get:
      tags:
        - drone
      summary: Get the last positon of the drone
      parameters:
        - name: drone_id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/id'
      responses:
        '200':
          description: Returns the drone last position
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/drone_position'

        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '410':
          $ref: '#/components/responses/410'
      security:
        - user_auth: []


  # link


  /link/auth/check:
    get:
      tags:
        - connect
      summary: Check if the credentials are valid
      responses:
        '200':
          description: are valid

        '401':
          $ref: '#/components/responses/401'

  /link/auth/login:
    post:
      tags:
        - link
      summary: Login with credentials
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/link_auth_login_post'
        required: true
      responses:
        '200':
          description: Logged in successfully
          headers:
            Set-Cookie:
              $ref: '#/components/headers/link_auth'

        '401':
          $ref: '#/components/responses/401'
      security:
        - link_auth: []


  /link/my-workspace:
    get:
      tags:
        - link
      summary: Get information about the workspace i am linked to
      responses:
        '200':
          description: either `false` (no workspace linked) or the workspace
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/link_workspace'
                  - type: boolean
                    example: false

        '401':
          $ref: '#/components/responses/401'
      security:
        - link_auth: []


  # dji pilot 2

  /link/dji-pilot-2/sdk-config:
    get:
      tags:
        - link-dji-pilot-2
      summary: Get config required for the dji bridge sdk
      responses:
        '200':
          description: Returns the config
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/link_dji_pilot_2_sdk_config'

        '401':
          $ref: '#/components/responses/401'
      security:
        - link_auth: []


components:


  schemas:

    # data type

    id:
      type: number
      example: 42
    timestamptz:
      type: string
      format: timestamptz
      description: ISO 8601 format
      example: "2023-12-11 23:06:52.7879+00"

    email:
      type: string
      example: "john.doe@example.com"

    password:
      type: string
      description: Maximum length is 72 Bytes (utf-8).
      example: "j9876sa1kjhqsa6dtasd12="

    # general

    reference:
      type: object
      required:
        - id
      properties:
        id:
          $ref: '#/components/schemas/id'

    #routes

    # auth

    auth_login_post:
      type: object
      required:
        - username
        - password
      properties:
        username:
          $ref: '#/components/schemas/email'
        password:
          type: string

    auth_login_with_token_post:
      type: object
      required:
        - token
      properties:
        token:
          type: string

    auth_register_post:
      deprecated: true
      type: object
      required:
        - name
        - email
      properties:
        email:
          $ref: '#/components/schemas/email'
        password:
          $ref: '#/components/schemas/password'

    auth_password_change_post:
      type: object
      required:
        - current_password
        - new_password
      properties:
        current_password:
          $ref: '#/components/schemas/password'
        new_password:
          $ref: '#/components/schemas/password'


    auth_password_reset_post:
      type: object
      required:
        - username
      properties:
        username:
          $ref: '#/components/schemas/email'

    auth_password_set_initial_post:
      type: object
      required:
        - new_password
      properties:
        new_password:
          $ref: '#/components/schemas/password'

    auth_password_set_new_post:
      type: object
      required:
        - new_password
        - code
      properties:
        new_password:
          $ref: '#/components/schemas/password'
        code:
          type: string



    # user

    user:
      type: object
      required:
        - id
        - name
      properties:
        id:
          $ref: '#/components/schemas/id'
        name:
          type: string
          example: Harry Potter


    user_self:
      type: object
      required:
        - id
        - name
        - email
        - created_at
        - locale
        - registration_incomplete
      properties:
        id:
          $ref: '#/components/schemas/id'
        name:
          type: string
          example: Harry Potter
        email:
          $ref: '#/components/schemas/email'
        created_at:
          $ref: '#/components/schemas/timestamptz'
        locale:
          type: string
          example: en-US
        registration_incomplete:
          type: boolean


    user_patch:
      type: object
      properties:
        name:
          type: string
          example: Harry Potter
        email:
          $ref: '#/components/schemas/email'
        locale:
          type: string
          example: en-US


    # workspace


    workspace:
      type: object
      required:
        - id
        - name
      properties:
        id:
          $ref: '#/components/schemas/id'
        name:
          type: string


    workspace_patch:
      type: object
      properties:
        name:
          type: string


    workspaces_post:
      type: object
      required:
        - name
      properties:
        name:
          type: string


    workspace_connections:
      type: array
      items:
          $ref: '#/components/schemas/connection'

    workspace_connections_post:
      type: object
      required:
        - name
      properties:
        name:
          type: string

    workspace_connections_post_response:
      type: object
      required:
        - id
        - secret
      properties:
        id:
          $ref: '#/components/schemas/id'
        secret:
          type: string

    connection:
      type: object
      required:
        - id
      properties:
        id:
          $ref: '#/components/schemas/id'
        remote_controller_id:
          $ref: '#/components/schemas/id'
        drone_id:
          $ref: '#/components/schemas/id'

    remote_controller:
      type: object
      required:
        - id
        - serial_number
        - type
      properties:
        id:
          $ref: '#/components/schemas/id'
        serial_number:
          type: string
        type:
          $ref: '#/components/schemas/remote_controller_type'

    remote_controller_type:
      type: integer
      description: 0 = dji rc pro enterprise, 1 = dji rc plus

    remote_controller_position:
      type: object
      required:
        - longitude
        - latitude
        - height
        - reported_at
      properties:
        longitude:
          type: number
        latitude:
          type: number
        height:
          type: number
        reported_at:
          $ref: '#/components/schemas/timestamptz'

    drone:
      type: object
      required:
        - id
        - serial_number
        - type
        - name
      properties:
        id:
          $ref: '#/components/schemas/id'
        serial_number:
          type: string
        type:
          $ref: '#/components/schemas/drone_type'
        name:
          type: string

    drone_type:
      type: integer
      description: 0 = dji mavic 3

    drone_position:
      type: object
      required:
        - longitude
        - latitude
        - height
        - reported_at
      properties:
        longitude:
          type: number
        latitude:
          type: number
        height:
          type: number
        reported_at:
          $ref: '#/components/schemas/timestamptz'


    # link

    link_auth_login_post:
      type: object
      required:
        - id
        - secret
      properties:
        id:
          type: string
        secret:
          type: string


    link_workspace:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: string
        name:
          type: string

    link_dji_pilot_2_sdk_config:
      type: object
      required:
        - app_id
        - app_key
        - app_license
      properties:
        app_id:
          type: string
        app_key:
          type: string
        app_license:
          type: string




  responses:
    '400':
      description: Bad Request (Invalid input)
      content:
        text:
          schema:
            type: string
            example: '.x'
            description: the property `x` is invalid

    '401':
      description: Unauthorized (this endpoint requires authorization)
      content:
        text:
          schema:
            type: string

    '403':
      description: Forbidden (you do not have permission to do this)
      content:
        text:
          schema:
            type: string


    '410':
      description: Gone (we understood your request but whatever you where looking for does not exist)
      content:
        text:
          schema:
            type: string

  headers:
    user_auth:
      description: used for authentication of a user
      schema:
        type: string
        example: user-auth=abcde12345; Path=/; HttpOnly
    link_auth:
      description: used for authentication of a connection
      schema:
        type: string
        example: connect-auth=abcde12345; Path=/; HttpOnly

  securitySchemes:
    user_auth:
      type: apiKey
      in: cookie
      name: user-auth
    link_auth:
      type: apiKey
      in: cookie
      name: link-auth
