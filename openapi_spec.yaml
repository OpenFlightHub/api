components:
  schemas:
    # data type

    id:
      type: number
      example: 42

    uuid:
      type: string
      example: "87ffce7c-da28-49cf-9134-8db9fd87ccd1"

    unixms:
      type: number
      example: "1239213862"
      description: Time in milliseconds since Unix Epoch time (January 1st, 1970 )

    timestamptz:
      type: string
      format: timestamptz
      description: ISO 8601 format with a timezone
      example: "2023-12-11 23:06:52.7879+00"

    timestamp:
      type: string
      format: timestamptz
      description: ISO 8601 format without a timezone
      example: "2023-12-11 23:06:52.7879"

    email:
      type: string
      example: "john.doe@example.com"

    password:
      type: string
      description: Maximum length is 72 Bytes (utf-8).
      example: "j9876sa1kjhqsa6dtasd12="

    # general

    reference:
      type: object
      required:
        - id
      properties:
        id:
          $ref: "#/components/schemas/id"

    #routes

    # auth

    auth_login_post:
      type: object
      required:
        - username
        - password
      properties:
        username:
          $ref: "#/components/schemas/email"
        password:
          type: string

    auth_login_with_token_post:
      type: object
      required:
        - token
      properties:
        token:
          type: string

    auth_register_post:
      deprecated: true
      type: object
      required:
        - name
        - email
      properties:
        email:
          $ref: "#/components/schemas/email"
        password:
          $ref: "#/components/schemas/password"

    auth_password_change_post:
      type: object
      required:
        - current_password
        - new_password
      properties:
        current_password:
          $ref: "#/components/schemas/password"
        new_password:
          $ref: "#/components/schemas/password"

    auth_password_reset_post:
      type: object
      required:
        - username
      properties:
        username:
          $ref: "#/components/schemas/email"

    auth_password_set_initial_post:
      type: object
      required:
        - new_password
      properties:
        new_password:
          $ref: "#/components/schemas/password"

    auth_password_set_new_post:
      type: object
      required:
        - new_password
        - code
      properties:
        new_password:
          $ref: "#/components/schemas/password"
        code:
          type: string

    auth_stream_token:
      type: object
      required:
        - token
      properties:
        token:
          type: string

    # user

    user:
      type: object
      required:
        - id
        - name
      properties:
        id:
          $ref: "#/components/schemas/id"
        name:
          type: string
          example: Harry Potter
        team_id:
          $ref: "#/components/schemas/id"

    user_self:
      type: object
      required:
        - id
        - name
        - email
        - created_at
        - locale
        - registration_incomplete
      properties:
        id:
          $ref: "#/components/schemas/id"
        name:
          type: string
          example: Harry Potter
        email:
          $ref: "#/components/schemas/email"
        created_at:
          $ref: "#/components/schemas/timestamptz"
        locale:
          type: string
          example: en-US
        registration_incomplete:
          type: boolean
        team_id:
          $ref: "#/components/schemas/id"

    user_patch:
      type: object
      properties:
        name:
          type: string
          example: Harry Potter
        email:
          $ref: "#/components/schemas/email"
        locale:
          type: string
          example: en-US


    user_my_organisations:
      type: array
      items:
        type: object
        required:
          - id
          - access_type
        properties:
          id:
            $ref: "#/components/schemas/id"
          access_type:
            type: integer
            description: 0 = owner, 1 = member


    user_my_teams:
      type: array
      items:
        type: object
        required:
          - id
          - access_type
        properties:
          id:
            $ref: "#/components/schemas/id"
          access_type:
            type: integer
            description: 0 = owner, 1 = member

    # team

    team:
      type: object
      required:
        - id
        - name
        - owner_user_id
        - created_at
        - state
      properties:
        id:
          $ref: "#/components/schemas/id"
        name:
          type: string
          example: Harry Potter
        owner_user_id:
          $ref: "#/components/schemas/id"
        created_at:
          $ref: "#/components/schemas/timestamptz"
        state:
          type: integer
          description: 0 = invited, 1 = live, 2 = locked, 3 = deleted
        organisation_id:
          $ref: "#/components/schemas/id"
        logo_file_id:
          $ref: "#/components/schemas/id"

    team_post:
      type: object
      required:
        - name
        - organisation_id
      properties:
        name:
          type: string
          example: Harry Potter
        organisation_id:
          $ref: "#/components/schemas/id"
        logo_file_id:
          $ref: "#/components/schemas/id"

    team_patch:
      type: object
      properties:
        name:
          type: string
          example: Harry Potter
        logo_file_id:
          $ref: "#/components/schemas/id"

    team_members:
      type: array
      items:
        type: object
        required:
          - id
          - name
        properties:
          id:
            $ref: "#/components/schemas/id"
          name:
            type: string
            example: Harry Potter

    # organisation

    organisation:
      type: object
      required:
        - id
        - name
        - owner_user_id
        - created_at
        - state
      properties:
        id:
          $ref: "#/components/schemas/id"
        name:
          type: string
          example: Harry Potter
        owner_user_id:
          $ref: "#/components/schemas/id"
        created_at:
          $ref: "#/components/schemas/timestamptz"
        state:
          type: integer
          description: 0 = invited, 1 = live, 2 = locked, 3 = deleted
        logo_file_id:
          $ref: "#/components/schemas/id"

    organisation_post:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          example: Harry Potter
        logo_file_id:
          $ref: "#/components/schemas/id"

    organisation_patch:
      type: object
      properties:
        name:
          type: string
          example: Harry Potter
        logo_file_id:
          $ref: "#/components/schemas/id"

    organisation_teams:
      type: array
      items:
        type: object
        required:
          - id
          - name
        properties:
          id:
            $ref: "#/components/schemas/id"
          name:
            type: string
            example: Harry Potter

    # admin

    admin_user_post:
      type: object
      required:
        - email
      properties:
        name:
          type: string
          example: Harry Potter
        email:
          $ref: "#/components/schemas/email"

    # file

    file:
      type: object
      required:
        - id
        - name
        - created_at
      properties:
        id:
          $ref: "#/components/schemas/id"
        name:
          type: string
        created_at:
          $ref: "#/components/schemas/timestamptz"
        thumbnail_format:
          type: string
          description: e.g. jpg (not null if a thumbnail is available at /file/thumbnail/)

    file_get_multiple:
      type: array
      items:
        $ref: "#/components/schemas/file"

    file_get_multiple_post:
      type: object
      required:
        - ids
      properties:
        ids:
          type: array
          items:
            $ref: "#/components/schemas/id"

    # workspace

    workspace:
      type: object
      required:
        - id
        - name
        - longitude
        - latitude
      properties:
        id:
          $ref: "#/components/schemas/id"
        name:
          type: string
        longitude:
          type: number
        latitude:
          type: number

    workspace_patch:
      type: object
      properties:
        name:
          type: string

    workspaces_post:
      type: object
      required:
        - name
        - longitude
        - latitude
      properties:
        name:
          type: string
        longitude:
          type: number
        latitude:
          type: number

    workspace_files:
      type: array
      items:
        $ref: "#/components/schemas/file"

    workspace_file_post:
      type: object
      required:
        - file
        - filename
      properties:
        file:
          type: string
          format: binary
        filename:
          type: string

    workspace_file_patch:
      type: object
      properties:
        filename:
          type: string

    workspace_connections:
      type: array
      items:
        $ref: "#/components/schemas/connection"

    workspace_connections_post:
      type: object
      required:
        - name
      properties:
        name:
          type: string

    workspace_connections_post_response:
      type: object
      required:
        - connection_id
        - secret
      properties:
        connection_id:
          type: string
        secret:
          type: string

    connection:
      type: object
      description: "property `drone_id`: the currently connected drone (does not mean that the drone is currently online)"
      required:
        - id
        - name
        - workspace_id
        - stream_is_alive
      properties:
        id:
          $ref: "#/components/schemas/id"
        name:
          type: string
        remote_controller_id:
          $ref: "#/components/schemas/id"
        drone_id:
          $ref: "#/components/schemas/id"
        workspace_id:
          $ref: "#/components/schemas/id"
        stream_is_alive:
          type: boolean

    workspace_geo_objects_get:
      type: array
      items:
        $ref: "#/components/schemas/geo_object"

    workspace_geo_objects_create:
      $ref: "#/components/schemas/geo_object_create"

    workspace_geo_object_patch:
      $ref: "#/components/schemas/geo_object_patch"

    geo_object:
      anyOf:
        - $ref: "#/components/schemas/geo_object_type0"
        - $ref: "#/components/schemas/geo_object_type1"
        - $ref: "#/components/schemas/geo_object_type2"

    geo_object_base:
      type: object
      required:
        - id
        - uuid
        - workspace_id
        - name
        - created_at
        - updated_at
        - type
        - sub_type
      properties:
        id:
          $ref: "#/components/schemas/id"
        uuid:
          $ref: "#/components/schemas/uuid"
        workspace_id:
          $ref: "#/components/schemas/id"
        name:
          type: string
        created_at:
          $ref: "#/components/schemas/timestamptz"
        updated_at:
          $ref: "#/components/schemas/timestamptz"
        type:
          type: number
        sub_type:
          type: number

    geo_object_type0:
      anyOf:
        - $ref: "#/components/schemas/geo_object_type0_subtype0"
        - $ref: "#/components/schemas/geo_object_type0_subtype1"
        - $ref: "#/components/schemas/geo_object_type0_subtype2"
        - $ref: "#/components/schemas/geo_object_type0_subtype3"

    geo_object_type0_subtype0:
