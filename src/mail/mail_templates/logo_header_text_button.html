<!doctype html>
<html>
  <body>
    <div
      style='background-color:#F5F5F5;color:#262626;font-family:"Helvetica Neue", "Arial Nova", "Nimbus Sans", Arial, sans-serif;font-size:16px;font-weight:400;letter-spacing:0.15008px;line-height:1.5;margin:0;padding:32px 0;min-height:100%;width:100%'
    >
      <table
        align="center"
        width="100%"
        style="margin:0 auto;max-width:600px;background-color:#FFFFFF"
        role="presentation"
        cellspacing="0"
        cellpadding="0"
        border="0"
      >
        <tbody>
          <tr style="width:100%">
            <td>
              <div
                style="padding:16px 24px 16px 24px;background-color:#1f1f1f;text-align:center"
              >
                <img
                  alt="###LOGO_ALT###"
                  src="###LOGO_SRC###"
                  width="100"
                  style="width:100px;outline:none;border:none;text-decoration:none;vertical-align:middle;display:inline-block;max-width:100%"
                />
              </div>
              <div style="padding:0px 0px 0px 0px;background-color:#F5F7FF">
                <hr
                  style="width:100%;border:none;border-top:2px solid #CCCCCC;margin:0"
                />
              </div>
              <div
                style="color:#e5e7eb;background-color:#1f1f1f;font-weight:normal;padding:16px 24px 16px 24px"
              >
                <h2>###HEADER###</h2>
                <p>###CONTENT###</p>
              </div>
              <div
                style="background-color:#1f1f1f;text-align:center;padding:16px 24px 16px 24px"
              >
                <a
                  href="###BUTTON_URL###"
                  style="color:#F5F7FF;font-size:16px;font-weight:bold;background-color:#4EA0FF;border-radius:4px;display:inline-block;padding:8px 12px;text-decoration:none"
                  target="_blank"
                  ><span
                    ><!--[if mso
                      ]><i
                        style="letter-spacing: 12px;mso-font-width:-100%;mso-text-raise:18"
                        hidden
                        >&nbsp;</i
                      ><!
                    [endif]--></span
                  ><span>###BUTTON_TEXT###</span
                  ><span
                    ><!--[if mso
                      ]><i
                        style="letter-spacing: 12px;mso-font-width:-100%"
                        hidden
                        >&nbsp;</i
                      ><!
                    [endif]--></span
                  ></a
                >
              </div>
              <div style="padding:0px 0px 0px 0px">
                <hr
                  style="width:100%;border:none;border-top:2px solid #CCCCCC;margin:0"
                />
              </div>
              <div
                style="color:#CDCFDC;background-color:#1f1f1f;font-weight:normal;padding:16px 24px 16px 24px"
              >
                <p><em>###FOOTER###</em></p>
              </div>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </body>
</html>
