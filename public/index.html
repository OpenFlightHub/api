<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>OpenFlightHub - API</title>

	<meta property="og:title" content="OpenFlightHub - API">
	<meta property="og:description" content="API for the OpenFlightHub">
	<meta property="og:type" content="website">

	<style>
		body {
			width: 100vw;
			height: 100vh;
			margin: 0;
			padding: 0;
			background: #071019;
			color: #4EA0FF;
			font-family: Arial, Helvetica, sans-serif;
		}

		* {
			box-sizing: border-box;
		}

		.content {
			width: 100%;
			height: 100%;
			display: flex;
			flex-direction: column;
			justify-content: center;
			align-items: center;
		}

		h1 {
			font-size: 48px;
		}

		a {
			position: relative;
			display: inline-flex;
			padding: 8px 20px;
			justify-content: center;
			align-items: center;
			gap: 10px;
			border: 0.1em solid #4EA0FF;
			border-radius: 4px;
			background: transparent;
			color: #edf5ff;
			text-decoration: none;

			font-size: 20px;
			font-style: normal;
			font-weight: 500;
			line-height: 120%;

			transition: all 0.2s ease;
		}

		a:hover {
			background: #27507f;
		}

	</style>
</head>
<body>
	<div class="content">
		<h1>Welcome to the OpenFlightHub - API!</h1>

		<a href="docs">Read the docs</a>
	</div>
</body>
</html>
